x-podman:
  in_pod: false

services:
  container:
    build:
      context: .
      dockerfile: containers/Containerfile
    user: "1000:1000"
    userns_mode: "keep-id:uid=1000,gid=1000"
    init: true
    working_dir: ${PWD:?Run podman compose from the real checkout root}
    labels:
      io.dotfiles.project-root: ${PWD:?Run podman compose from the real checkout root}
    volumes:
      - type: bind
        source: .
        target: ${PWD:?Run podman compose from the real checkout root}
        bind:
          selinux: z
    cap_drop:
      - ALL
    # Podman's default seccomp profile gates Chromium's namespace chroot on this capability.
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges
    http_proxy: false
    shm_size: 1gb
    stop_grace_period: 10s
