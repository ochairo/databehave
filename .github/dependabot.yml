version: 2

updates:
  # Discover all workspace packages from the root that owns the shared pnpm lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Typecheck against the oldest supported Node major, even when newer runtimes are supported.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # GitHub Actions (workflows are SHA-pinned; dependabot will open PRs to bump)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
