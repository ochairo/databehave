name: cd

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the complete release without publishing
        type: boolean
        default: true
      bootstrap:
        description: Enable NPM_TOKEN for the first release before trusted publishing is configured
        type: boolean
        default: false

permissions:
  contents: read

# Never interrupt a registry write with another release.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: ${{ inputs.dry_run == false && github.ref == 'refs/heads/main' && github.repository == 'ochairo/databehave' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
          registry-url: ${{ inputs.bootstrap && 'https://registry.npmjs.org' || '' }}
      - name: Verify bundled npm supports the reviewed publishing flow
        run: test "$(npm --version)" = "11.19.1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.release-artifact-id }}
          path: artifacts/release
          merge-multiple: true
      # No dependency installation, lifecycle scripts, or artifact-supplied code in this job.
      - name: Verify all bytes and publish sequentially using npm OIDC
        if: ${{ inputs.bootstrap == false }}
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/release.mjs publish artifacts/release "$SOURCE_REVISION"
      - name: Bootstrap publication with the temporary npm token
        if: ${{ inputs.bootstrap == true }}
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Bootstrap publication requires the NPM_TOKEN GitHub secret" >&2
            exit 1
          fi
          node scripts/release.mjs publish artifacts/release "$SOURCE_REVISION"
