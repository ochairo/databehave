name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      release-artifact-id:
        description: Exact verified release bundle from this run
        value: ${{ jobs.quality.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tooling

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm signatures:check
      - run: pnpm api:check
      - run: pnpm docs:check
      - run: pnpm examples:check
      - name: Install verified workflow validator
        run: |
          node scripts/install-actionlint.mjs "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: pnpm workflow:check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Allow sandboxed Playwright Chromium
        shell: bash
        run: |
          shopt -s nullglob
          browsers=("$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          if [[ ${#browsers[@]} -ne 1 || ! -x "${browsers[0]}" ]]; then
            echo "Expected exactly one installed Chromium headless executable" >&2
            exit 1
          fi
          # Ubuntu 24.04 restricts user namespaces for downloaded browsers.
          sudo tee /etc/apparmor.d/databehave-playwright >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile databehave-playwright "${browsers[0]}" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/databehave-playwright
      - run: pnpm test:e2e
      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Prepare and dry-run exact release tarballs
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          pnpm release:prepare artifacts/release "$SOURCE_REVISION"
          pnpm release:dry-run artifacts/release "$SOURCE_REVISION"
      - name: Upload immutable bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release/
          retention-days: 30
          if-no-files-found: error

  package-consumers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.quality.outputs.artifact-id }}
          path: artifacts/release
          merge-multiple: true
      - name: Verify and consume downloaded packages without workspace dependencies
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/packaged-consumer.mjs artifacts/release "$SOURCE_REVISION"
